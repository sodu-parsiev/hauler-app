<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Welcome to Hauler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; line-height: 1.45; }
    h1 { font-size: 22px; }
    ol { padding-left: 20px; }
    .btn { display:inline-block; margin-top:12px; padding:8px 12px; border:1px solid #7aa7c7; background:#e1ecf4; color:#39739d; border-radius:3px; text-decoration:none; }
    #permission-panel { border: 1px solid #d0d7de; background: #f6f8fa; padding: 16px; border-radius: 6px; margin-top: 24px; }
    #permission-panel h2 { margin-top: 0; font-size: 18px; }
    #grant-access { font-weight: 600; cursor: pointer; }
    #permission-message { margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Enable Hauler in Safari</h1>
  <ol>
    <li>Open Safari.</li>
    <li>Tap <b>aA</b> → <b>Manage Extensions</b>.</li>
    <li>Turn on <b>Hauler Helper</b>.</li>
    <li>Select <b>Allow on All Websites</b> (or specific sites).</li>
  </ol>
  <p><a class="btn" href="https://weidian.com/item.html?itemID=2570705409" target="_blank" rel="noopener">Open test page</a></p>
  <section id="permission-panel" class="hidden" aria-live="polite">
    <h2>Grant marketplace access</h2>
    <p>Hauler needs access to Taobao, Tmall, Weidian, and 1688 to open listings in the app.</p>
    <button id="grant-access" class="btn" type="button">Grant Access</button>
    <p id="permission-message" class="hidden"></p>
  </section>
  <script src="welcome.js" type="module"></script>
</body>
</html>
